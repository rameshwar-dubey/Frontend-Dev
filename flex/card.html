<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <h2>Beautiful Sunset</h2>
          <img src="https://picsum.photos/300/200?sunset" alt="Sunset">
        </div>
        <div class="card-back">
          <p>
            This is a mesmerizing view of a sunset captured by the sea. The golden hues
            reflect peace and serenity.
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
