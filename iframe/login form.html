<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Login Form</h2>
    <form action="/login-form" method="post" target="_blank">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required> <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required> <br><br>
        <input type="hidden" name="csrf-token" value="dummy-csrf-token"> 
        <!-- CSRF token is secret unique key that proves the request came from your own site,
         Protects against unauthorized form submissions or API calls -->
        <button type="submit">Submit</button>
    </form>
</body>
</html>
