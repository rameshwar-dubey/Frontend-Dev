<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Security Example</title>
</head>
<body>
    <h2>HTML Form Security Demonstration</h2>

    <form action="#" method="post" autocomplete="off" target="_blank">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Login</button>
    </form>

    <hr>

    <p><strong>Note:</strong> Turning off <code>autocomplete</code> helps improve security by preventing browsers from automatically storing or suggesting sensitive information like usernames and passwords. This reduces the risk of unauthorized access, especially on shared or public computers.</p>
</body>
</html>
